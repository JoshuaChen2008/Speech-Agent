<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <link rel="stylesheet" href="../ui/shared/tokens.css">
  <link rel="stylesheet" href="caption.css">
  <title>Live Subtitle</title>
</head>
<body>
  <div class="wrap" id="wrap" data-locked="off">
    <div class="caption-card" id="captionCard">
      <!-- 工具条“洞”：此区域字幕窗放行穿透，让下面/上面的工具条窗接管事件 -->
      <div class="tb-hole" id="tbHole" aria-hidden="true"></div>

      <!--
        固定高度字幕流（SEM-F20）：一个稳定视口 + 一个内容节点，段落作为子节点
        自下而上堆叠，满高后最上方最旧的完整视觉行被裁掉。不再有 previous /
        current / translation 三个各带行数预算的槽位。partial 更新只改 textContent。
        整块对辅助技术隐藏 —— partial 每秒刷新十几次，逐帧播报会让屏幕阅读器无法使用。
        定稿文本另行送进下面的 live region。
      -->
      <div class="captions" id="captions" aria-hidden="true">
        <div class="caption-flow" id="captionFlow"></div>
      </div>

      <!-- 只接收 final / refined / translated，不接收 partial -->
      <p class="sr-only" id="liveRegion" aria-live="polite" aria-atomic="true"></p>

      <span class="lock-hint" aria-hidden="true">已钉住 · Ctrl+Alt+L 解锁</span>
    </div>
  </div>
  <script src="../ui/shared/appearance.js"></script>
  <script src="../ui/shared/caption-reducer.js"></script>
  <script src="caption.js"></script>
</body>
</html>
