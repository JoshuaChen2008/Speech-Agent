<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <link rel="stylesheet" href="../ui/shared/tokens.css">
  <link rel="stylesheet" href="../ui/shared/phases.css">
  <link rel="stylesheet" href="toolbar.css">
  <title>Toolbar</title>
</head>
<body>
  <div class="wrap" id="wrap" data-locked="off">
    <!--
      条内结构由 toolbar.js 从 RuntimeSnapshot 的视图模型生成。
      这里只留容器，避免 DOM 里出现一份和 runtime-view.js 平行的状态真相。
    -->
    <div class="bar toolbar" id="toolbar">
      <!-- 拖动握把：条上其余位置几乎全是按钮，没有它就没有可靠的抓取目标 -->
      <div class="grip" id="grip" title="拖动工具条" aria-hidden="true"></div>
      <div class="status" id="status" role="status"></div>
      <i class="sep"></i>
      <div class="bar-group" id="commands"></div>
      <i class="sep"></i>
      <div class="bar-group" id="windowControls"></div>
    </div>
  </div>

  <script type="module" src="./entry.js"></script>
</body>
</html>
