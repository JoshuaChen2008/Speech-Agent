name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-user-journeys:
    name: Windows user journeys and regression suite
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Qualify Electron SQLite storage worker composition
        shell: powershell
        run: |
          $db0Dir = Join-Path $PWD '.artifacts/db0-ci'
          New-Item -ItemType Directory -Force -Path $db0Dir | Out-Null
          $db0Stdout = Join-Path $db0Dir 'stdout.log'
          $db0Stderr = Join-Path $db0Dir 'stderr.log'
          $db0Electron = Join-Path $PWD 'node_modules/electron/dist/electron.exe'
          $db0Process = Start-Process -FilePath $db0Electron `
            -ArgumentList @('scripts/db0-sqlite-smoke.js','--report','.artifacts/db0-ci/report.json','--work-dir','.artifacts/db0-ci/work') `
            -WorkingDirectory $PWD `
            -RedirectStandardOutput $db0Stdout `
            -RedirectStandardError $db0Stderr `
            -WindowStyle Hidden -Wait -PassThru
          Get-Content -Raw -ErrorAction SilentlyContinue $db0Stdout
          if ($db0Process.ExitCode -ne 0) {
            Get-Content -Raw -ErrorAction SilentlyContinue $db0Stderr
            throw "DB0 Electron qualification failed with exit code $($db0Process.ExitCode)"
          }
          node scripts/verify-db0-report.js .artifacts/db0-ci/report.json

      - name: Run DB1 production storage worker journey
        shell: powershell
        run: |
          $db1Dir = Join-Path $PWD '.artifacts/db1-ci'
          New-Item -ItemType Directory -Force -Path $db1Dir | Out-Null
          $db1Stdout = Join-Path $db1Dir 'stdout.log'
          $db1Stderr = Join-Path $db1Dir 'stderr.log'
          $db1Electron = Join-Path $PWD 'node_modules/electron/dist/electron.exe'
          $db1Process = Start-Process -FilePath $db1Electron `
            -ArgumentList @('scripts/db1-storage-smoke.js','--report','.artifacts/db1-ci/report.json','--work-dir','.artifacts/db1-ci/work') `
            -WorkingDirectory $PWD `
            -RedirectStandardOutput $db1Stdout `
            -RedirectStandardError $db1Stderr `
            -WindowStyle Hidden -Wait -PassThru
          Get-Content -Raw -ErrorAction SilentlyContinue $db1Stdout
          if ($db1Process.ExitCode -ne 0) {
            Get-Content -Raw -ErrorAction SilentlyContinue $db1Stderr
            throw "DB1 Electron storage journey failed with exit code $($db1Process.ExitCode)"
          }
          node scripts/verify-db1-report.js .artifacts/db1-ci/report.json

      - name: Run deterministic integration journeys and full regression suite
        run: npm run test:ci
