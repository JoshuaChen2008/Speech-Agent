name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-user-journeys:
    name: Windows user journeys and regression suite
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # 排在所有重步骤之前：字幕排版是本阶段改动最频繁的部分，而这一步只要一两分钟。
      # 它只启动最小字幕宿主，不证明产品组合根、真实 ASR 或人工视觉验收（见报告 boundaries）。
      - name: Qualify fixed-height caption layout
        shell: powershell
        run: |
          $layoutDir = Join-Path $PWD '.artifacts/caption-layout-ci'
          New-Item -ItemType Directory -Force -Path $layoutDir | Out-Null
          $layoutStdout = Join-Path $layoutDir 'stdout.log'
          $layoutStderr = Join-Path $layoutDir 'stderr.log'
          $layoutElectron = Join-Path $PWD 'node_modules/electron/dist/electron.exe'
          $layoutProcess = Start-Process -FilePath $layoutElectron `
            -ArgumentList @('scripts/caption-layout-smoke.js','--report','.artifacts/caption-layout-ci/report.json') `
            -WorkingDirectory $PWD `
            -RedirectStandardOutput $layoutStdout `
            -RedirectStandardError $layoutStderr `
            -WindowStyle Hidden -Wait -PassThru
          Get-Content -Raw -ErrorAction SilentlyContinue $layoutStdout
          if ($layoutProcess.ExitCode -ne 0) {
            Get-Content -Raw -ErrorAction SilentlyContinue $layoutStderr
            throw "Caption layout qualification failed with exit code $($layoutProcess.ExitCode)"
          }
          node scripts/verify-caption-layout-report.js .artifacts/caption-layout-ci/report.json

      - name: Qualify Electron SQLite storage worker composition
        shell: powershell
        run: |
          $db0Dir = Join-Path $PWD '.artifacts/db0-ci'
          New-Item -ItemType Directory -Force -Path $db0Dir | Out-Null
          $db0Stdout = Join-Path $db0Dir 'stdout.log'
          $db0Stderr = Join-Path $db0Dir 'stderr.log'
          $db0Electron = Join-Path $PWD 'node_modules/electron/dist/electron.exe'
          $db0Process = Start-Process -FilePath $db0Electron `
            -ArgumentList @('scripts/db0-sqlite-smoke.js','--report','.artifacts/db0-ci/report.json','--work-dir','.artifacts/db0-ci/work') `
            -WorkingDirectory $PWD `
            -RedirectStandardOutput $db0Stdout `
            -RedirectStandardError $db0Stderr `
            -WindowStyle Hidden -Wait -PassThru
          Get-Content -Raw -ErrorAction SilentlyContinue $db0Stdout
          if ($db0Process.ExitCode -ne 0) {
            Get-Content -Raw -ErrorAction SilentlyContinue $db0Stderr
            throw "DB0 Electron qualification failed with exit code $($db0Process.ExitCode)"
          }
          node scripts/verify-db0-report.js .artifacts/db0-ci/report.json

      - name: Run DB1 production storage worker journey
        shell: powershell
        run: |
          $db1Dir = Join-Path $PWD '.artifacts/db1-ci'
          New-Item -ItemType Directory -Force -Path $db1Dir | Out-Null
          $db1Stdout = Join-Path $db1Dir 'stdout.log'
          $db1Stderr = Join-Path $db1Dir 'stderr.log'
          $db1Electron = Join-Path $PWD 'node_modules/electron/dist/electron.exe'
          $db1Process = Start-Process -FilePath $db1Electron `
            -ArgumentList @('scripts/db1-storage-smoke.js','--report','.artifacts/db1-ci/report.json','--work-dir','.artifacts/db1-ci/work') `
            -WorkingDirectory $PWD `
            -RedirectStandardOutput $db1Stdout `
            -RedirectStandardError $db1Stderr `
            -WindowStyle Hidden -Wait -PassThru
          Get-Content -Raw -ErrorAction SilentlyContinue $db1Stdout
          if ($db1Process.ExitCode -ne 0) {
            Get-Content -Raw -ErrorAction SilentlyContinue $db1Stderr
            throw "DB1 Electron storage journey failed with exit code $($db1Process.ExitCode)"
          }
          node scripts/verify-db1-report.js .artifacts/db1-ci/report.json

      - name: Run storage Gateway recovery and Coordinator barrier journey
        shell: powershell
        run: |
          $gatewayDir = Join-Path $PWD '.artifacts/storage-gateway-ci'
          New-Item -ItemType Directory -Force -Path $gatewayDir | Out-Null
          $gatewayStdout = Join-Path $gatewayDir 'stdout.log'
          $gatewayStderr = Join-Path $gatewayDir 'stderr.log'
          $gatewayElectron = Join-Path $PWD 'node_modules/electron/dist/electron.exe'
          $gatewayProcess = Start-Process -FilePath $gatewayElectron `
            -ArgumentList @('scripts/storage-gateway-smoke.js','--report','.artifacts/storage-gateway-ci/report.json','--work-dir','.artifacts/storage-gateway-ci/work') `
            -WorkingDirectory $PWD `
            -RedirectStandardOutput $gatewayStdout `
            -RedirectStandardError $gatewayStderr `
            -WindowStyle Hidden -Wait -PassThru
          Get-Content -Raw -ErrorAction SilentlyContinue $gatewayStdout
          if ($gatewayProcess.ExitCode -ne 0) {
            Get-Content -Raw -ErrorAction SilentlyContinue $gatewayStderr
            throw "Storage Gateway Electron journey failed with exit code $($gatewayProcess.ExitCode)"
          }
          node scripts/verify-storage-gateway-report.js .artifacts/storage-gateway-ci/report.json

      - name: Run four-window product-shell user journey
        shell: powershell
        run: |
          node scripts/run-supervised-electron.js `
            --entry scripts/product-shell-smoke.js `
            --entry-arg --work-dir `
            --entry-arg .artifacts/product-shell-ci/work `
            --entry-arg --report `
            --entry-arg .artifacts/product-shell-ci/report.json `
            --report .artifacts/product-shell-ci/exit-evidence.json `
            --strict-report
          if ($LASTEXITCODE -ne 0) {
            throw "Supervised product-shell journey failed with exit code $LASTEXITCODE"
          }
          node scripts/verify-product-shell-report.js .artifacts/product-shell-ci/report.json
          if ($LASTEXITCODE -ne 0) {
            throw "Product-shell report verification failed with exit code $LASTEXITCODE"
          }
          node scripts/verify-electron-exit-evidence.js .artifacts/product-shell-ci/exit-evidence.json
          if ($LASTEXITCODE -ne 0) {
            throw "Electron exit evidence verification failed with exit code $LASTEXITCODE"
          }

      - name: Build and inspect the packaged test runtime
        shell: powershell
        run: |
          npm run package:smoke
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged smoke build failed with exit code $LASTEXITCODE"
          }
          node scripts/verify-package-layout.js `
            --package-dir .artifacts/packaged-smoke-build/win-unpacked `
            --variant smoke `
            --report .artifacts/b5-ci/smoke-layout.json
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged smoke layout verification failed with exit code $LASTEXITCODE"
          }

      - name: Run packaged ASAR native SQLite and four-window journey
        shell: powershell
        run: |
          $packagedExecutable = (Resolve-Path '.artifacts/packaged-smoke-build/win-unpacked/LiveSubtitlePackagedSmoke.exe').Path
          $packagedArtifacts = Join-Path $PWD '.artifacts/packaged-product-ci'
          node scripts/run-packaged-product-shell.js `
            --executable $packagedExecutable `
            --artifacts-root $packagedArtifacts `
            --electron-major 43
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged product journey failed with exit code $LASTEXITCODE"
          }

      - name: Build and inspect the exact NSIS candidate
        shell: powershell
        run: |
          npm run package:release
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS candidate build failed with exit code $LASTEXITCODE"
          }
          node scripts/verify-package-layout.js `
            --package-dir .artifacts/release-package/win-unpacked `
            --variant release `
            --installer .artifacts/release-package/Live-Subtitle-0.1.0-x64.exe `
            --qualification-binding .artifacts/packaged-product-ci/qualification-binding.json `
            --report .artifacts/b5-ci/release-layout.json
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS candidate layout verification failed with exit code $LASTEXITCODE"
          }

      - name: Qualify isolated NSIS install and uninstall mechanics
        shell: powershell
        run: |
          node scripts/qualify-nsis-lifecycle.js `
            --installer .artifacts/release-package/Live-Subtitle-0.1.0-x64.exe `
            --artifacts-root .artifacts/nsis-lifecycle-ci `
            --report .artifacts/nsis-lifecycle-ci/report.json
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS lifecycle qualification failed with exit code $LASTEXITCODE"
          }

      - name: Run non-interactive core integration and evidence regression lanes
        run: npm run test:ci

      # 只有前面的布局、存储、产品壳、双启动、release、NSIS 和三条 test lane
      # 全部成功，才会生成这一最终索引。writer 同时要求实际 HEAD == GITHUB_SHA
      # 且受跟踪工作树干净；verifier 再复核关键报告和制品的交叉哈希。
      - name: Bind qualification evidence to the exact CI revision
        shell: powershell
        run: |
          node scripts/write-ci-qualification-index.js `
            --expected-revision $env:GITHUB_SHA `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --event-name $env:GITHUB_EVENT_NAME `
            --repository $env:GITHUB_REPOSITORY `
            --workflow-name $env:GITHUB_WORKFLOW `
            --job-name windows-user-journeys `
            --caption-layout-report .artifacts/caption-layout-ci/report.json `
            --packaged-binding-report .artifacts/packaged-product-ci/qualification-binding.json `
            --release-layout-report .artifacts/b5-ci/release-layout.json `
            --nsis-lifecycle-report .artifacts/nsis-lifecycle-ci/report.json `
            --installer .artifacts/release-package/Live-Subtitle-0.1.0-x64.exe `
            --package-lock package-lock.json `
            --workflow-file .github/workflows/ci.yml `
            --report .artifacts/ci-qualification/index.json
          if ($LASTEXITCODE -ne 0) {
            throw "CI qualification index generation failed with exit code $LASTEXITCODE"
          }
          node scripts/verify-ci-qualification-index.js `
            --report .artifacts/ci-qualification/index.json `
            --caption-layout-report .artifacts/caption-layout-ci/report.json `
            --packaged-binding-report .artifacts/packaged-product-ci/qualification-binding.json `
            --release-layout-report .artifacts/b5-ci/release-layout.json `
            --nsis-lifecycle-report .artifacts/nsis-lifecycle-ci/report.json `
            --installer .artifacts/release-package/Live-Subtitle-0.1.0-x64.exe `
            --package-lock package-lock.json `
            --workflow-file .github/workflows/ci.yml
          if ($LASTEXITCODE -ne 0) {
            throw "CI qualification index verification failed with exit code $LASTEXITCODE"
          }

      # 结构化报告与 stdout/stderr 都写在 .artifacts（gitignored）里，跑完即随 runner 销毁。
      # 失败时不上传就只剩「第 N 步失败了」，无法定位是哪个字段不满足。
      # 报告本身按 SEM-F14 不含字幕正文、PCM 或音频路径。
      - name: Upload structured qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/**/*.json
            .artifacts/**/*.log
          if-no-files-found: warn
          retention-days: 14
